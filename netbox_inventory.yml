# https://docs.ansible.com/ansible/latest/collections/netbox/netbox/nb_inventory_inventory.html
#

# CREDENTIALS ARE PASSED AS CUSTOM CREDS FROM AAP, WE NEED TO LOAD THE VARS
env:
  NETBOX_API: '{{ NETBOX_API }}'
  NETBOX_TOKEN: '{{ NETBOX_TOKEN }}'

# If you want to pass in clear text (bad idea) you'd have to declare those
#api_endpoint: https://...
#token: abc...

plugin: netbox.netbox.nb_inventory

# READ ONLY TOKEN
# Feel free to use it if my Netbox instance is up and running. No warranty of availability provided :D
validate_certs: True

config_context: True

group_by:
  - device_roles

# Filter out not connected items such as racks
device_query_filters:
  - has_primary_ip: 'true'

# Do not report offline machines
query_filters:
 - status: active

keyed_groups:
  - prefix: status
    key: status.value
